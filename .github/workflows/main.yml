name: Build Kernel

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up required dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc \
          libncurses-dev bison flex \
          libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          cpio device-tree-compiler

    # Step 3: Ensure Environment Variables and Compilers are Correct
    - name: Validate Environment and Tools
      run: |
        echo "Checking GCC and Clang versions..."
        gcc --version || echo "GCC not installed or not in PATH"
        clang --version || echo "Clang not installed or not in PATH"
        echo "Current PATH: $PATH"

    # Step 4: Check Defconfig File
    - name: Validate Defconfig
      run: |
        if [ ! -f arch/arm64/configs/vendor/r8q_eur_openx_defconfig ]; then
          echo "Defconfig file not found! Please check the file path."
          exit 1
        fi

    # Step 5: Preprocess Kconfig Files
    - name: Preprocess Kconfig Files
      run: |
        find . -name "Kconfig" -exec sed -i 's/unsupported_character//g' {} +

    # Step 6: Configure kernel build
    - name: Configure kernel
      run: |
        make O=out ARCH=arm64 vendor/r8q_eur_openx_defconfig # Replace 'vendor/some_defconfig' with actual defconfig

    # Step 7: Build kernel with verbose output
    - name: Build kernel
      run: |
        make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- V=1

    # Step 8: Save output to artifacts
    - name: Upload compiled kernel to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-kernel
        path: out/arch/arm64/boot/ # Replace with the actual path to compiled kernel files
